<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pure Love Network State</title>

<!--
=====================================================================
WHERE TO EDIT — read this first
=====================================================================
This page holds STRUCTURE only. No wording, no logo path, no colour list,
no timing is written in this file. Change things in the file named below.

  TO CHANGE ...                                   EDIT THIS FILE
  ----------------------------------------------  ----------------------------
  The gate/seal LOGO picture (community logo)     data/copy.js  -> logos.community
  The door LOGO picture (Network of States logo)  data/copy.js  -> logos.network
  The welcome message on the door                 data/copy.js  -> door
  The title typed under the door logo             data/copy.js  -> networkTitle
  The looping welcome inside the lift             data/copy.js  -> liftLoop
  The single words under the floor indicator      data/copy.js  -> liftWords
  Other small lift wording (labels)               data/copy.js  -> lift
  The marquee announcements (and their links)     data/announcements.js
  Floors and wings (names, order, adding floors)  data/floors.js
  The project library (empty for now)             data/projects.js
  The colour swatches in the popup                data/copy.js  -> swatches
  How long each step waits / types                data/copy.js  -> timings
  The building picture seen through the gate      css/backdrop.css (picture path)
  Colours and proportions of the building         css/architecture.css (top)
  How the gate, popup and door LOOK               css/entrance.css
  How the lift doors, walls, flower, particles    css/elevator.css
  How the clock, floor indicator, marquee, panel  css/lift-control.css
  The flower stand drawing                        index.html (the <svg> marked FLOWER STAND)
  The order of the entrance steps                 js/entrance.js
  The lift doors, welcome loop, particles         js/elevator.js
  The floor control, clock, marquee, travelling   js/lift-control.js

To swap a logo: put your PNG in assets/logos/ and change ONE path in data/copy.js.

IF YOU UPLOAD A NEW VERSION AND THE PAGE LOOKS UNCHANGED:
  your browser is showing the old files. In the lines below, change ?v=4
  to ?v=5 (any new number) in every <link> and <script>, then upload this file.

IF SOMETHING IS MISSING: a small dark note appears at the bottom of the page
  naming the file or logo that did not load. Check it is uploaded in the
  right folder, with the same spelling and small letters.
=====================================================================
-->

<link rel="stylesheet" href="css/architecture.css?v=4"> <!-- EDIT css/architecture.css : building colours and proportions -->
<link rel="stylesheet" href="css/base.css?v=4">          <!-- EDIT css/base.css : page-wide basics (fonts, reset, warning note) -->
<link rel="stylesheet" href="css/backdrop.css?v=4">      <!-- EDIT css/backdrop.css : the building seen through the gate -->
<link rel="stylesheet" href="css/entrance.css?v=4">      <!-- EDIT css/entrance.css : gate, popup, welcome door -->
<link rel="stylesheet" href="css/elevator.css?v=4">      <!-- EDIT css/elevator.css : lift doors, walls, flower, particles -->
<link rel="stylesheet" href="css/lift-control.css?v=4">  <!-- EDIT css/lift-control.css : clock, floor indicator, marquee, floor panel -->
</head>
<body>

<div id="stage" data-phase="gate">

  <!-- The building seen THROUGH the gate. Picture: css/backdrop.css -->
  <div id="backdrop" class="backdrop" aria-hidden="true"><div class="backdrop-art"></div></div>

  <!-- The "spine": the central column. The entrance and lift live only here. -->
  <main class="spine">

    <!-- ============ 1. THE GATE (css/entrance.css, js/entrance.js) ============ -->
    <section id="gate" class="gate" aria-label="Gate">
      <div class="gate-structure">
        <svg class="gate-roof" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true">
          <path class="roof-body" d="M0 52 C 60 48, 100 38, 140 26 C 165 18, 185 12, 200 6 C 215 12, 235 18, 260 26 C 300 38, 340 48, 400 52 L 400 70 L 0 70 Z"/>
          <path class="roof-edge" d="M0 52 C 60 48, 100 38, 140 26 C 165 18, 185 12, 200 6 C 215 12, 235 18, 260 26 C 300 38, 340 48, 400 52"/>
        </svg>
        <div class="gate-frame">
          <span class="gate-post gate-post-left"></span>
          <span class="gate-post gate-post-right"></span>
          <div class="gate-leaf gate-leaf-left"><span class="gate-ring"></span></div>
          <div class="gate-leaf gate-leaf-right"><span class="gate-ring"></span></div>
          <!-- The seal: the COMMUNITY logo, centred on the gate.
               Its picture path is in data/copy.js -> logos.community -->
          <div id="seal" class="seal"><img id="seal-img" class="seal-img" alt=""></div>
        </div>
        <div class="gate-step"></div>
      </div>
    </section>

    <!-- ============ 2. THE PERSONALISATION POPUP ============ -->
    <!-- Wording of this popup: data/copy.js -> personalise.  Look: css/entrance.css (.popup) -->
    <form id="personalise" class="popup" autocomplete="off" aria-hidden="true">
      <h1 id="popup-heading" class="popup-heading"></h1>
      <label class="popup-label" for="visitor-name" id="popup-name-label"></label>
      <input id="visitor-name" class="popup-input" type="text" maxlength="40">
      <p class="popup-label" id="popup-colour-label"></p>
      <div id="swatches" class="swatches" role="radiogroup" aria-labelledby="popup-colour-label"></div>
      <button id="popup-continue" class="btn" type="submit"></button>
    </form>

    <!-- ============ 3. THE WELCOME DOOR ============ -->
    <section id="door" class="door" aria-label="Welcome door" aria-hidden="true">
      <div class="door-inner">
        <p id="door-greeting" class="door-greeting"></p>
        <p id="door-message" class="door-message"></p>
        <!-- The door logo: the NETWORK OF STATES logo. Path: data/copy.js -> logos.network -->
        <img id="door-logo" class="door-logo reveal" alt="">
        <p id="door-title" class="door-title"></p>
        <button id="enter-btn" class="btn btn-enter reveal" type="button"></button>
      </div>
    </section>

    <!-- ============ 4. THE LIFT (css/elevator.css, css/lift-control.css,
                                       js/elevator.js, js/lift-control.js) ============ -->
    <section id="lift" class="lift" aria-label="Lift" aria-hidden="true">
      <div class="lift-interior">

        <!-- Floral wall (picture: assets/elevator/floral-wall.svg) and rising particles -->
        <div id="lift-wall" class="lift-wall" aria-hidden="true"></div>
        <div id="lift-particles" class="lift-particles" aria-hidden="true"></div>

        <!-- UPPER CENTRE: personalised welcome (wording: data/copy.js -> lift, liftLoop) -->
        <header class="lift-welcome">
          <p id="lift-kicker" class="lift-kicker"></p>
          <p id="lift-name" class="lift-name"></p>
          <p id="lift-loop" class="lift-loop"></p>
        </header>

        <!-- MIDDLE: clock + floor indicator + looping words (left) | flower stand (right only) -->
        <div class="lift-middle">
          <div class="lift-controls">
            <svg id="lift-clock" class="lift-clock" viewBox="0 0 100 100" role="img" aria-label="Clock">
              <circle class="clock-face" cx="50" cy="50" r="46"/>
              <g id="clock-ticks" class="clock-ticks"></g>
              <line id="hand-h" class="hand hand-h" x1="50" y1="50" x2="50" y2="29"/>
              <line id="hand-m" class="hand hand-m" x1="50" y1="50" x2="50" y2="17"/>
              <line id="hand-s" class="hand hand-s" x1="50" y1="54" x2="50" y2="12"/>
              <circle class="clock-pin" cx="50" cy="50" r="2.6"/>
            </svg>

            <!-- Floor indicator: current floor, direction, next floor, destination -->
            <div id="floor-indicator" class="floor-indicator" role="status" aria-live="polite">
              <span class="fi-light" aria-hidden="true"></span>
              <span id="fi-current" class="fi-current"></span>
              <span id="fi-dir" class="fi-dir"></span>
              <span id="fi-trip" class="fi-trip"></span>
            </div>

            <!-- Looping single words (wording: data/copy.js -> liftWords) -->
            <p id="lift-words" class="lift-words"><span id="lw-word" class="lw-word"></span><span id="lw-line" class="lw-line"></span></p>
          </div>

          <!-- FLOWER STAND: line drawing in the visitor's colour (right side only).
               To change the drawing, edit the <path> lines below. Colours: css/elevator.css -->
          <div class="lift-flower" aria-hidden="true">
            <svg viewBox="0 0 120 300" preserveAspectRatio="xMidYMax meet" class="flower-svg">
              <defs>
                <linearGradient id="flowerGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="300">
                  <stop offset="0"   style="stop-color: var(--visitor-light)"/>
                  <stop offset=".55" style="stop-color: var(--visitor)"/>
                  <stop offset="1"   style="stop-color: var(--visitor-deep)"/>
                </linearGradient>
              </defs>
              <g class="flower-lines" stroke="url(#flowerGrad)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <!-- stand: three legs, ring, foot, top plate -->
                <path d="M30 284 C 36 252, 44 216, 50 180"/>
                <path d="M90 284 C 84 252, 76 216, 70 180"/>
                <path d="M60 286 L60 182"/>
                <path d="M22 286 H98"/>
                <path d="M41 238 Q60 250 79 238"/>
                <path d="M33 180 H87"/>
                <path d="M37 180 Q60 193 83 180"/>
                <!-- pot -->
                <path d="M41 180 L45 142 H75 L79 180"/>
                <path d="M38 142 H82"/>
                <path d="M44 158 H76"/>
                <!-- stems -->
                <path d="M60 142 C 58 112, 63 82, 60 54"/>
                <path d="M60 122 C 42 108, 32 88, 28 70"/>
                <path d="M60 112 C 78 98, 90 80, 93 64"/>
                <!-- leaves -->
                <path d="M60 104 C 48 102, 42 94, 40 88 C 50 88, 58 94, 60 104Z"/>
                <path d="M61 92 C 73 90, 79 82, 81 76 C 71 76, 63 82, 61 92Z"/>
                <path d="M54 128 C 44 130, 36 126, 33 120 C 43 118, 51 122, 54 128Z"/>
                <path d="M66 130 C 76 132, 84 128, 87 122 C 77 120, 69 124, 66 130Z"/>
                <!-- main bloom -->
                <g class="bloom">
                  <ellipse cx="60" cy="27" rx="7" ry="15"/>
                  <ellipse cx="60" cy="27" rx="7" ry="15" transform="rotate(72 60 42)"/>
                  <ellipse cx="60" cy="27" rx="7" ry="15" transform="rotate(144 60 42)"/>
                  <ellipse cx="60" cy="27" rx="7" ry="15" transform="rotate(216 60 42)"/>
                  <ellipse cx="60" cy="27" rx="7" ry="15" transform="rotate(288 60 42)"/>
                  <circle cx="60" cy="42" r="4"/>
                </g>
                <!-- side blooms -->
                <g class="bloom bloom-side">
                  <ellipse cx="28" cy="58" rx="4.5" ry="9"/>
                  <ellipse cx="28" cy="58" rx="4.5" ry="9" transform="rotate(72 28 67)"/>
                  <ellipse cx="28" cy="58" rx="4.5" ry="9" transform="rotate(144 28 67)"/>
                  <ellipse cx="28" cy="58" rx="4.5" ry="9" transform="rotate(216 28 67)"/>
                  <ellipse cx="28" cy="58" rx="4.5" ry="9" transform="rotate(288 28 67)"/>
                </g>
                <g class="bloom bloom-side">
                  <ellipse cx="93" cy="54" rx="4.5" ry="9"/>
                  <ellipse cx="93" cy="54" rx="4.5" ry="9" transform="rotate(72 93 63)"/>
                  <ellipse cx="93" cy="54" rx="4.5" ry="9" transform="rotate(144 93 63)"/>
                  <ellipse cx="93" cy="54" rx="4.5" ry="9" transform="rotate(216 93 63)"/>
                  <ellipse cx="93" cy="54" rx="4.5" ry="9" transform="rotate(288 93 63)"/>
                </g>
              </g>
            </svg>
          </div>
        </div>

        <!-- BOTTOM: identity panel = logo circle (also the floor control) + marquee -->
        <footer class="lift-identity">
          <p class="lift-title"><span id="lift-title"></span><span class="lift-title-sep" aria-hidden="true"> · </span><span id="lift-subtitle"></span></p>
          <div class="marquee-bar">
            <!-- The circle uses the community logo (data/copy.js -> logos.community) -->
            <button id="logo-control" class="logo-control" type="button" aria-expanded="false" aria-controls="floor-panel">
              <img id="lift-logo" class="logo-control-img" alt="">
            </button>
            <div class="marquee"><div id="marquee-track" class="marquee-track"></div></div>
          </div>
          <!-- Floating floor panel: opens above the logo circle. Floors: data/floors.js -->
          <div id="floor-panel" class="floor-panel" role="dialog" aria-labelledby="fp-heading" hidden>
            <p id="fp-heading" class="fp-heading"></p>
            <ul id="fp-list" class="fp-list"></ul>
          </div>
        </footer>
      </div>

      <div class="lift-door lift-door-left"></div>
      <div class="lift-door lift-door-right"></div>
    </section>

  </main>
</div>

<!-- A plain-words warning note. Used by the self-check below and by js/entrance.js. -->
<script>
window.PLNS_warn = function (msg) {
  var n = document.getElementById('plns-note');
  if (!n) { n = document.createElement('div'); n.id = 'plns-note'; n.className = 'plns-note'; document.body.appendChild(n); }
  var p = document.createElement('p'); p.textContent = msg; n.appendChild(p);
};
</script>

<!-- Scripts load in this order. They are plain scripts so the page also works
     when opened straight from a folder, not only from GitHub Pages. -->
<script src="data/copy.js?v=4"></script>          <!-- EDIT data/copy.js : all wording, logo paths, swatches, timings -->
<script src="data/floors.js?v=4"></script>        <!-- EDIT data/floors.js : floors and wings -->
<script src="data/announcements.js?v=4"></script> <!-- EDIT data/announcements.js : marquee announcements -->
<script src="data/projects.js?v=4"></script>      <!-- EDIT data/projects.js : project library (empty for now) -->
<script src="js/entrance.js?v=4"></script>   <!-- EDIT js/entrance.js : order of the entrance steps -->
<script src="js/elevator.js?v=4"></script>   <!-- EDIT js/elevator.js : lift doors, welcome loop, particles -->
<script src="js/lift-control.js?v=4"></script> <!-- EDIT js/lift-control.js : floor control, clock, marquee, travelling -->
<script src="js/main.js?v=4"></script>       <!-- EDIT js/main.js : starts the building (rarely needs changing) -->

<!-- Self-check: if a file did not load, say which one, in plain words. -->
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    if (typeof PLNS_COPY === 'undefined') {
      PLNS_warn('The file data/copy.js did not load. Check it is uploaded inside the "data" folder, with exactly that spelling.');
      return;
    }
    var missing = [];
    if (typeof PLNS_BUILDING === 'undefined')      missing.push('data/floors.js');
    if (typeof PLNS_ANNOUNCEMENTS === 'undefined') missing.push('data/announcements.js');
    if (!(window.PLNS && PLNS.entrance)) missing.push('js/entrance.js');
    if (!(window.PLNS && PLNS.elevator)) missing.push('js/elevator.js');
    if (!(window.PLNS && PLNS.liftControl)) missing.push('js/lift-control.js');
    if (!(window.PLNS && PLNS.started))  missing.push('js/main.js');
    if (missing.length) PLNS_warn('These files did not load: ' + missing.join(', ') + '. Check each is uploaded inside its folder ("js" or "data"), with exactly that spelling.');
  }, 1200);
});
</script>
</body>
</html>
