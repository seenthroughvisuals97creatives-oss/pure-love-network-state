<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pure Love Network State</title>

<!--
=====================================================================
WHERE TO EDIT — read this first
=====================================================================
This page holds STRUCTURE only. No wording, no logo path, no colour list,
no timing is written in this file. Change things in the file named below.

  TO CHANGE ...                                   EDIT THIS FILE
  ----------------------------------------------  ----------------------------
  The gate/seal LOGO picture (community logo)     data/copy.js  -> logos.community
  The door LOGO picture (Network of States logo)  data/copy.js  -> logos.network
  The welcome message on the door                 data/copy.js  -> door
  The title typed under the door logo             data/copy.js  -> networkTitle
  The looping welcome inside the lift             data/copy.js  -> liftLoop
  The single words under the floor indicator      data/copy.js  -> liftWords
  Other small lift wording (labels)               data/copy.js  -> lift
  The marquee announcements (and their links)     data/announcements.js
  Floors and wings (names, order, adding floors)  data/floors.js
  The five menu items and their popup words       data/popups.js
  Wing wording (Explore, Left wing ...)           data/copy.js  -> wings
  How the wings look                              css/wings.css
  How popups look                                 css/popup.css
  The wings: building them, swiping, mobile       js/wings.js
  The floating popup itself                       js/popup.js
  The project library (empty for now)             data/projects.js
  The colour swatches in the popup                data/copy.js  -> swatches
  How long each step waits / types                data/copy.js  -> timings
  The building picture seen through the gate      css/backdrop.css (picture path)
  Colours and proportions of the building         css/architecture.css (top)
  The words on top of the gate                    data/copy.js  -> gateInscription
  How the gate and the popup LOOK                 css/entrance.css
  How the door frame, door and lobby LOOK         css/door.css
  The lobby picture (hall with the lift)          assets/entrance/lobby.svg
  The flowers on the door frame                   assets/entrance/garland-h.svg and garland-v.svg
  How the lift doors, walls, flower, particles    css/elevator.css
  How the clock, floor indicator, marquee, panel  css/lift-control.css
  The flower stand drawing                        index.html (the <svg> marked FLOWER STAND)
  The order of the entrance steps                 js/entrance.js
  The lift doors, welcome loop, particles         js/elevator.js
  The floor control, clock, marquee, travelling   js/lift-control.js

To swap a logo: put your PNG in assets/logos/ and change ONE path in data/copy.js.

IF YOU UPLOAD A NEW VERSION AND THE PAGE LOOKS UNCHANGED:
  your browser is showing the old files. In the lines below, change ?v=6
  to ?v=7 (any new number) in every <link> and <script>, then upload this file.

IF SOMETHING IS MISSING: a small dark note appears at the bottom of the page
  naming the file or logo that did not load. Check it is uploaded in the
  right folder, with the same spelling and small letters.
=====================================================================
-->

<link rel="stylesheet" href="css/architecture.css?v=6"> <!-- EDIT css/architecture.css : building colours and proportions -->
<link rel="stylesheet" href="css/base.css?v=6">          <!-- EDIT css/base.css : page-wide basics (fonts, reset, warning note) -->
<link rel="stylesheet" href="css/backdrop.css?v=6">      <!-- EDIT css/backdrop.css : the building seen through the gate -->
<link rel="stylesheet" href="css/entrance.css?v=6">      <!-- EDIT css/entrance.css : gate and popup -->
<link rel="stylesheet" href="css/door.css?v=6">          <!-- EDIT css/door.css : door frame, door, lobby, moving forward -->
<link rel="stylesheet" href="css/elevator.css?v=6">      <!-- EDIT css/elevator.css : lift doors, walls, flower, particles -->
<link rel="stylesheet" href="css/lift-control.css?v=6">  <!-- EDIT css/lift-control.css : clock, floor indicator, marquee, floor panel -->
<link rel="stylesheet" href="css/wings.css?v=6">         <!-- EDIT css/wings.css : the left and right wings -->
<link rel="stylesheet" href="css/popup.css?v=6">         <!-- EDIT css/popup.css : the floating popups (menu items, Explore) -->
</head>
<body>

<div id="stage" data-phase="gate">

  <!-- The building seen THROUGH the gate. Picture: css/backdrop.css -->
  <div id="backdrop" class="backdrop" aria-hidden="true"><div class="backdrop-art"></div></div>

  <!-- The dark stage the popup stands on, after the gate and outside have faded (css/entrance.css) -->
  <div id="stage-dark" class="stage-dark" aria-hidden="true"></div>

  <!-- The "spine": the central column. The entrance and lift live only here. -->
  <main class="spine">

    <!-- ============ 1. THE GATE (css/entrance.css, js/entrance.js) ============ -->
    <section id="gate" class="gate" aria-label="Gate">
      <div class="gate-structure">
        <!-- Top beam of the gate, carrying the inscription (wording: data/copy.js -> gateInscription) -->
        <div class="gate-lintel"><span id="gate-inscription" class="gate-inscription"></span></div>
        <div class="gate-frame">
          <span class="gate-post gate-post-left"></span>
          <span class="gate-post gate-post-right"></span>
          <div class="gate-leaf gate-leaf-left"><span class="gate-ring"></span></div>
          <div class="gate-leaf gate-leaf-right"><span class="gate-ring"></span></div>
          <!-- The seal: the COMMUNITY logo, centred on the gate.
               Its picture path is in data/copy.js -> logos.community -->
          <div id="seal" class="seal"><img id="seal-img" class="seal-img" alt=""></div>
        </div>
        <div class="gate-step"></div>
      </div>
    </section>

    <!-- ============ 2. THE PERSONALISATION POPUP ============ -->
    <!-- Wording of this popup: data/copy.js -> personalise.  Look: css/entrance.css (.popup) -->
    <form id="personalise" class="popup" autocomplete="off" aria-hidden="true">
      <h1 id="popup-heading" class="popup-heading"></h1>
      <label class="popup-label" for="visitor-name" id="popup-name-label"></label>
      <input id="visitor-name" class="popup-input" type="text" maxlength="40">
      <p class="popup-label" id="popup-colour-label"></p>
      <div id="swatches" class="swatches" role="radiogroup" aria-labelledby="popup-colour-label"></div>
      <button id="popup-continue" class="btn" type="submit"></button>
    </form>

    <!-- ============ 4. THE LIFT (css/elevator.css, css/lift-control.css,
                                       js/elevator.js, js/lift-control.js) ============ -->
    <section id="lift" class="lift" aria-label="Lift" aria-hidden="true">
      <div class="lift-interior">

        <!-- Floral wall (picture: assets/elevator/floral-wall.svg) and rising particles -->
        <div id="lift-wall" class="lift-wall" aria-hidden="true"></div>
        <div id="lift-particles" class="lift-particles" aria-hidden="true"></div>

        <!-- UPPER CENTRE: personalised welcome (wording: data/copy.js -> lift, liftLoop) -->
        <header class="lift-welcome">
          <p id="lift-kicker" class="lift-kicker"></p>
          <p id="lift-name" class="lift-name"></p>
          <p id="lift-loop" class="lift-loop"></p>
        </header>

        <!-- MIDDLE. LEFT: clock with the floor indicator beside it, looping words under.
                    RIGHT: the flower pillar. The space under the left side stays empty:
                    that is where the floating panel opens. -->
        <div class="lift-middle">
          <div class="lift-left">
            <div class="lift-cluster">
              <svg id="lift-clock" class="lift-clock" viewBox="0 0 100 100" role="img" aria-label="Clock">
                <circle class="clock-face" cx="50" cy="50" r="46"/>
                <g id="clock-ticks" class="clock-ticks"></g>
                <line id="hand-h" class="hand hand-h" x1="50" y1="50" x2="50" y2="29"/>
                <line id="hand-m" class="hand hand-m" x1="50" y1="50" x2="50" y2="17"/>
                <line id="hand-s" class="hand hand-s" x1="50" y1="54" x2="50" y2="12"/>
                <circle class="clock-pin" cx="50" cy="50" r="2.6"/>
              </svg>

              <!-- Floor indicator: current floor, direction, next floor, destination -->
              <div id="floor-indicator" class="floor-indicator" role="status" aria-live="polite">
                <span class="fi-light" aria-hidden="true"></span>
                <span id="fi-current" class="fi-current"></span>
                <span id="fi-dir" class="fi-dir"></span>
                <span id="fi-trip" class="fi-trip"></span>
              </div>
            </div>

            <!-- Looping single words (wording: data/copy.js -> liftWords) -->
            <p id="lift-words" class="lift-words"><span id="lw-word" class="lw-word"></span><span id="lw-line" class="lw-line"></span></p>
          </div>

          <!-- FLOWER PILLAR: a fluted column holding a floral arrangement, in the visitor's
               colour (right side only). To change the drawing, edit the <path> lines below.
               Colours: css/elevator.css -->
          <div class="lift-pillar" aria-hidden="true">
            <svg viewBox="0 0 100 330" preserveAspectRatio="xMidYMax meet" class="pillar-svg">
              <defs>
                <linearGradient id="flowerGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="330">
                  <stop offset="0"   style="stop-color: var(--visitor-light)"/>
                  <stop offset=".5"  style="stop-color: var(--visitor)"/>
                  <stop offset="1"   style="stop-color: var(--visitor-deep)"/>
                </linearGradient>
              </defs>
              <g class="pillar-stone" fill="none" stroke="#b79556" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <!-- base: two steps -->
                <path d="M10 326 H90 V316 H10 Z"/>
                <path d="M18 316 H82 V306 H18 Z"/>
                <!-- shaft: gently tapered -->
                <path d="M34 306 L36 128 M66 306 L64 128"/>
                <!-- flutes -->
                <path d="M41 302 L42 132 M47 302 L47.5 132 M53 302 L52.5 132 M59 302 L58 132"/>
                <!-- capital -->
                <path d="M30 128 H70"/>
                <path d="M26 122 H74 V114 H26 Z"/>
                <path d="M32 114 Q50 108 68 114"/>
                <!-- bowl on top of the pillar -->
                <path d="M34 114 C 30 102, 38 92, 50 90 C 62 92, 70 102, 66 114"/>
                <path d="M32 91 H68"/>
              </g>
              <g class="flower-lines" stroke="url(#flowerGrad)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <!-- stems -->
                <path d="M50 91 C 49 70, 51 48, 50 26"/>
                <path d="M47 91 C 38 78, 28 66, 24 48"/>
                <path d="M53 91 C 62 76, 72 62, 76 44"/>
                <path d="M45 91 C 40 74, 36 60, 34 40"/>
                <path d="M55 91 C 60 72, 64 58, 66 38"/>
                <!-- leaves -->
                <path d="M50 76 C 40 74, 34 68, 32 62 C 42 62, 48 68, 50 76Z"/>
                <path d="M51 66 C 61 64, 67 58, 69 52 C 59 52, 53 58, 51 66Z"/>
                <path d="M46 84 C 38 88, 30 86, 27 80 C 36 78, 43 80, 46 84Z"/>
                <path d="M54 84 C 62 88, 70 86, 73 80 C 64 78, 57 80, 54 84Z"/>
                <!-- main bloom -->
                <g class="bloom">
                  <ellipse cx="50" cy="14" rx="6" ry="12"/>
                  <ellipse cx="50" cy="14" rx="6" ry="12" transform="rotate(72 50 26)"/>
                  <ellipse cx="50" cy="14" rx="6" ry="12" transform="rotate(144 50 26)"/>
                  <ellipse cx="50" cy="14" rx="6" ry="12" transform="rotate(216 50 26)"/>
                  <ellipse cx="50" cy="14" rx="6" ry="12" transform="rotate(288 50 26)"/>
                  <circle cx="50" cy="26" r="3.4"/>
                </g>
                <!-- side blooms -->
                <g class="bloom bloom-side">
                  <ellipse cx="24" cy="38" rx="4" ry="8"/>
                  <ellipse cx="24" cy="38" rx="4" ry="8" transform="rotate(72 24 46)"/>
                  <ellipse cx="24" cy="38" rx="4" ry="8" transform="rotate(144 24 46)"/>
                  <ellipse cx="24" cy="38" rx="4" ry="8" transform="rotate(216 24 46)"/>
                  <ellipse cx="24" cy="38" rx="4" ry="8" transform="rotate(288 24 46)"/>
                </g>
                <g class="bloom bloom-side">
                  <ellipse cx="76" cy="34" rx="4" ry="8"/>
                  <ellipse cx="76" cy="34" rx="4" ry="8" transform="rotate(72 76 42)"/>
                  <ellipse cx="76" cy="34" rx="4" ry="8" transform="rotate(144 76 42)"/>
                  <ellipse cx="76" cy="34" rx="4" ry="8" transform="rotate(216 76 42)"/>
                  <ellipse cx="76" cy="34" rx="4" ry="8" transform="rotate(288 76 42)"/>
                </g>
                <!-- buds -->
                <path d="M34 40 C 31 34, 33 29, 36 28 C 39 30, 38 36, 34 40Z"/>
                <path d="M66 38 C 63 32, 65 27, 68 26 C 71 28, 70 34, 66 38Z"/>
              </g>
            </svg>
          </div>
        </div>

        <!-- BOTTOM: identity panel = logo circle (also the floor control) + marquee -->
        <footer class="lift-identity">
          <p class="lift-title"><span id="lift-title"></span><span class="lift-title-sep" aria-hidden="true"> · </span><span id="lift-subtitle"></span></p>
          <div class="marquee-bar">
            <!-- The circle uses the community logo (data/copy.js -> logos.community) -->
            <button id="logo-control" class="logo-control" type="button" aria-expanded="false" aria-controls="floor-panel">
              <img id="lift-logo" class="logo-control-img" alt="">
            </button>
            <div class="marquee"><div id="marquee-track" class="marquee-track"></div></div>
          </div>
          <!-- Floating panel: opens above the logo circle, over EMPTY space only.
               Top: floor numbers (floors: data/floors.js). Below: the five menu items (data/popups.js). -->
          <div id="floor-panel" class="floor-panel" role="dialog" aria-labelledby="fp-heading" hidden>
            <p id="fp-heading" class="fp-heading"></p>
            <div id="fp-floors" class="fp-floors" role="group" aria-labelledby="fp-heading"></div>
            <div class="fp-rule" aria-hidden="true"></div>
            <ul id="fp-menu" class="fp-menu"></ul>
          </div>
        </footer>
      </div>

      <div class="lift-door lift-door-left"></div>
      <div class="lift-door lift-door-right"></div>
    </section>

  </main>

  <!-- ============ 3. THE WELCOME DOOR SCENE (css/door.css, js/entrance.js) ============
       The base of the tower: a door frame with flowers, the door, and behind it the
       ground-floor lobby. When you press Enter the door opens and we move forward. -->
  <div id="entry" class="entry" aria-hidden="true">
    <div id="entry-zoom" class="entry-zoom">
      <div class="facade"></div>
      <div class="entry-ground"></div>

      <div class="door-assembly">
        <span class="flora flora-top"></span><span class="flora flora-left"></span><span class="flora flora-right"></span>

        <div class="doorway">
          <!-- Behind the door: the ground-floor lobby (picture: assets/entrance/lobby.svg) -->
          <div class="lobby"><img id="lobby-img" class="lobby-img" src="assets/entrance/lobby.svg" alt=""></div>

          <!-- The door leaf: welcome words, logo, title and the Enter button -->
          <section id="door" class="door" aria-label="Welcome door">
            <span class="door-hinge hinge-1"></span><span class="door-hinge hinge-2"></span><span class="door-hinge hinge-3"></span>
            <span class="door-handle"></span>
            <div class="door-inner">
              <p id="door-greeting" class="door-greeting"></p>
              <p id="door-message" class="door-message"></p>
              <!-- The door logo: the NETWORK OF STATES logo. Path: data/copy.js -> logos.network -->
              <img id="door-logo" class="door-logo reveal" alt="">
              <p id="door-title" class="door-title"></p>
              <button id="enter-btn" class="btn btn-enter reveal" type="button"></button>
            </div>
          </section>
        </div>
        <div class="door-step"></div>
      </div>
    </div>
  </div>

  <!-- ============ 5. THE WINGS (css/wings.css, js/wings.js) ============
       Left and right of the lift. Built from data/floors.js. On desktop both are visible
       beside the lift. On phones only a sliver of each shows; tap it or swipe to bring it in. -->
  <aside id="wing-left"  class="wing wing-left"  aria-label="Left wing"></aside>
  <aside id="wing-right" class="wing wing-right" aria-label="Right wing"></aside>

  <!-- Phones only: the current floor stays visible while a wing is open. Tap it to return to the lift. -->
  <button id="floor-badge" class="floor-badge" type="button"></button>

  <!-- ============ 6. THE FLOATING POPUP (css/popup.css, js/popup.js) ============ -->
  <div id="pop-root" class="pop-root" hidden>
    <div class="pop-scrim"></div>
    <div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="pop-title">
      <button id="pop-close" class="pop-close" type="button" aria-label="Close">&times;</button>
      <h2 id="pop-title" class="pop-title"></h2>
      <div id="pop-body" class="pop-body"></div>
    </div>
  </div>
</div>

<!-- A plain-words warning note. Used by the self-check below and by js/entrance.js. -->
<script>
window.PLNS_warn = function (msg) {
  var n = document.getElementById('plns-note');
  if (!n) { n = document.createElement('div'); n.id = 'plns-note'; n.className = 'plns-note'; document.body.appendChild(n); }
  var p = document.createElement('p'); p.textContent = msg; n.appendChild(p);
};
</script>

<!-- Scripts load in this order. They are plain scripts so the page also works
     when opened straight from a folder, not only from GitHub Pages. -->
<script src="data/copy.js?v=6"></script>          <!-- EDIT data/copy.js : all wording, logo paths, swatches, timings -->
<script src="data/floors.js?v=6"></script>        <!-- EDIT data/floors.js : floors and wings -->
<script src="data/announcements.js?v=6"></script> <!-- EDIT data/announcements.js : marquee announcements -->
<script src="data/projects.js?v=6"></script>      <!-- EDIT data/projects.js : project library (empty for now) -->
<script src="data/popups.js?v=6"></script>        <!-- EDIT data/popups.js : the five menu items and their popup words -->
<script src="js/entrance.js?v=6"></script>   <!-- EDIT js/entrance.js : order of the entrance steps -->
<script src="js/popup.js?v=6"></script>      <!-- EDIT js/popup.js : the floating popup -->
<script src="js/wings.js?v=6"></script>      <!-- EDIT js/wings.js : the left and right wings, swipe -->
<script src="js/elevator.js?v=6"></script>   <!-- EDIT js/elevator.js : lift doors, welcome loop, particles -->
<script src="js/lift-control.js?v=6"></script> <!-- EDIT js/lift-control.js : floor control, clock, marquee, travelling -->
<script src="js/main.js?v=6"></script>       <!-- EDIT js/main.js : starts the building (rarely needs changing) -->

<!-- Self-check: if a file did not load, say which one, in plain words. -->
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    if (typeof PLNS_COPY === 'undefined') {
      PLNS_warn('The file data/copy.js did not load. Check it is uploaded inside the "data" folder, with exactly that spelling.');
      return;
    }
    var missing = [];
    if (typeof PLNS_BUILDING === 'undefined')      missing.push('data/floors.js');
    if (typeof PLNS_ANNOUNCEMENTS === 'undefined') missing.push('data/announcements.js');
    if (typeof PLNS_MENU === 'undefined')          missing.push('data/popups.js');
    if (!(window.PLNS && PLNS.entrance)) missing.push('js/entrance.js');
    if (!(window.PLNS && PLNS.elevator)) missing.push('js/elevator.js');
    if (!(window.PLNS && PLNS.liftControl)) missing.push('js/lift-control.js');
    if (!(window.PLNS && PLNS.wings))       missing.push('js/wings.js');
    if (!(window.PLNS && PLNS.popup))       missing.push('js/popup.js');
    if (!(window.PLNS && PLNS.started))  missing.push('js/main.js');
    if (missing.length) PLNS_warn('These files did not load: ' + missing.join(', ') + '. Check each is uploaded inside its folder ("js" or "data"), with exactly that spelling.');
  }, 1200);
});
</script>
</body>
</html>
